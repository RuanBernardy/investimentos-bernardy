<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Investimentos Bernardy</title>

<link rel="icon" type="image/png" href="./brasao.png" />
<link rel="shortcut icon" href="./brasao.png" />
<link rel="apple-touch-icon" href="./brasao.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Investimentos Bernardy" />
<meta name="theme-color" content="#0a1020" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Investimentos Bernardy","short_name":"Investimentos","start_url":"./","display":"standalone","background_color":"%230a1020","theme_color":"%230a1020","icons":[{"src":"./brasao.png","sizes":"192x192 512x512","type":"image/png"}]}' />

<style>
  :root{
    --bg:#0a1020; --card:#111a2e; --card2:#0d1527; --line:#1f2b46; --text:#e7edf8; --mut:#8c9ab5; --mut2:#5f6e8c;
    --brand:#10b981; --brand-d:#059669; --amber:#f5b13d; --cyan:#22d3ee; --rose:#fb7185; --violet:#a78bfa; --blue:#60a5fa;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;font-size:14px}
  .num{font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  /* header */
  header{position:sticky;top:0;z-index:30;background:rgba(10,16,32,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{width:36px;height:36px;object-fit:contain;border-radius:10px;background:#060b17;border:1px solid var(--line);padding:3px}
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .brand small{display:block;color:var(--mut);font-size:11px}
  .hright{display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--mut);cursor:pointer}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .pill.on .dot{background:var(--brand)} .pill.off .dot{background:var(--rose)}
  input[type=month]{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--text);font-size:12px;color-scheme:dark}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}

  main{padding:20px 0 60px}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .card h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 .sub{font-weight:500;color:var(--mut);font-size:12px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
  .big{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .hint{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.4}
  .green{color:var(--brand)} .amber{color:var(--amber)} .cyan{color:var(--cyan)} .rose{color:var(--rose)} .violet{color:var(--violet)} .blue{color:var(--blue)} .mut{color:var(--mut)}

  .btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:#334566;background:#142038}
  .btn.primary{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
  .btn.primary:hover{background:var(--brand)}
  .btn.sm{padding:4px 9px;font-size:11.5px;border-radius:8px}
  .btn.ghost{background:none}
  .btn.danger:hover{border-color:#7f1d2e;color:var(--rose)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}

  .bar{height:7px;background:#1a2540;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s}
  .item{padding:12px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0;padding-top:0}
  .item .name{font-weight:600;font-size:13.5px}
  .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px;font-weight:600;vertical-align:middle}
  .tag.g{color:var(--brand);border-color:#12503c} .tag.a{color:var(--amber);border-color:#5a4318}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--mut);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
  td{padding:9px 10px;border-bottom:1px solid #18233b;text-align:right;white-space:nowrap}
  th:first-child,td:first-child,.l{text-align:left}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}
  .empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--line);border-radius:12px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(3,6,14,.75);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal.hidden{display:none}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:20px}
  .sheet h3{margin:0 0 14px;font-size:15px}
  .sheet td,.sheet th{white-space:normal}
  .sheet td:last-child{white-space:nowrap}
  .sheet.wide{max-width:560px}
  .tag.o{color:#fb923c;border-color:#6b3a14} .tag.r{color:var(--rose);border-color:#6b1d2b}
  .v-buy{color:var(--brand)} .v-ok{color:var(--amber)} .v-weak{color:#fb923c} .v-avoid{color:var(--rose)} .v-ins{color:var(--mut)}
  .alert{border:1px solid #6b1d2b;background:rgba(251,113,133,.08);color:var(--rose);border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:10px;line-height:1.5}
  .alert.soft{border-color:#5a4318;background:rgba(245,177,61,.07);color:var(--amber)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;outline:none;color-scheme:dark}
  .field input:focus,.field select:focus{border-color:var(--brand)}
  .field .hint{margin-top:4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .inl{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right;font-size:13px;color-scheme:dark}

  .gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
  .gate.hidden{display:none}
  .gate .sheet{max-width:360px;text-align:center}
  .gate img{width:64px;height:64px;object-fit:contain;margin:0 auto 10px;display:block}
  .gate .field{text-align:left}
  .gate .err{color:var(--rose);font-size:12.5px;min-height:18px;margin-bottom:8px}
  .linkbtn{background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:10px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16223a;border:1px solid #2a3a5e;padding:9px 16px;border-radius:12px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}

  .stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#1a2540}
  .stack i{display:block;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
  .legend b{color:var(--text);font-weight:600}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}

  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px;overflow-x:auto}
  .chart .col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .chart .bars{display:flex;align-items:flex-end;gap:2px;height:118px;width:100%;justify-content:center}
  .chart .bars i{display:block;width:42%;max-width:14px;border-radius:3px 3px 0 0;min-height:1px}
  .chart small{font-size:10px;color:var(--mut)}
  @media (max-width:520px){ .big{font-size:19px} .brand small{display:none} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">
        <img src="./brasao.png" alt="" onerror="this.style.display='none'" />
        <div><h1>Investimentos Bernardy</h1><small>Organização financeira consciente</small></div>
      </div>
      <div class="hright">
        <input type="month" id="month" title="Mês de referência" />
        <button class="pill" id="syncPill" data-act="settings" title="Sincronização e configurações"><span class="dot"></span><span id="syncTxt">Local</span></button>
        <button class="btn sm" data-act="settings" title="Configurações">⚙</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<div class="gate hidden" id="gate">
  <div id="gateLoading" class="mut">Carregando…</div>
  <form class="sheet hidden" id="gateForm" autocomplete="on">
    <img src="./brasao.png" alt="" onerror="this.style.display='none'" />
    <h3>Investimentos Bernardy</h3>
    <p class="hint" style="margin:-8px 0 16px">Acesso restrito. Entre com a sua conta.</p>
    <div class="field"><label for="g_email">E-mail</label><input id="g_email" type="email" autocomplete="username" required /></div>
    <div class="field"><label for="g_pass">Senha</label><input id="g_pass" type="password" autocomplete="current-password" required /></div>
    <div class="err" id="gateErr"></div>
    <button class="btn primary" style="width:100%;padding:10px" id="gateBtn">Entrar</button>
    <button type="button" class="linkbtn" id="gateReset">Esqueci a senha</button>
    <button type="button" class="linkbtn" id="gateToggle">Primeiro acesso? Criar conta</button>
  </form>
  <div class="sheet hidden" id="gateVerify">
    <h3>Confirme seu e-mail</h3>
    <p class="hint" id="gateVerTxt" style="margin:0 0 14px"></p>
    <div class="err" id="gateVerErr"></div>
    <button type="button" class="btn primary" style="width:100%;padding:10px" id="gateVerOk">Já confirmei</button>
    <button type="button" class="linkbtn" id="gateVerResend">Reenviar e-mail</button>
    <button type="button" class="linkbtn" id="gateVerOut">Usar outra conta</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

<script>
/* =========================================================
   Chaves de armazenamento (as mesmas da versão anterior)
   ========================================================= */
const SK = 'FINANCE_ALLOCATOR_DATA_PERMANENT';
const CK = 'FINANCE_CLOUD_SYNC_BIN_ID';
const FK = 'FINANCE_FINNHUB_KEY';      // chave do Finnhub (cotações EUA): também só neste aparelho
try { localStorage.removeItem('FINANCE_BRAPI_TOKEN'); } catch (e) {}   // a chave da brapi não fica mais no navegador: quem usa é o robô do GitHub Actions
const BK = 'FINANCE_BACKUP_PRE_V2';
const TABK = 'FINANCE_LAST_TAB';

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const usd = v => (Number(v) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd4 = v => (Number(v) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 4 });
const tkKey = t => String(t).replace(/[.#$\/\[\]]/g, '_');          // chaves do Firebase não aceitam "." (ex.: BRK.B)
const CLASSES = {
  fii:     { l: 'FII',       cur: 'BRL', src: 'b3', freq: 12 },
  acao:    { l: 'Ação BR',   cur: 'BRL', src: 'b3', freq: 4 },
  etf:     { l: 'ETF BR',    cur: 'BRL', src: 'b3', freq: 2 },
  bdr:     { l: 'BDR',       cur: 'BRL', src: 'b3', freq: 4 },
  us_acao: { l: 'Ação EUA',  cur: 'USD', src: 'us', freq: 4 },
  us_etf:  { l: 'ETF EUA',   cur: 'USD', src: 'us', freq: 4 }
};
const clsOf = c => CLASSES[c] || CLASSES.fii;
const fxRate = () => (state.fx && state.fx.rate > 0) ? state.fx.rate : 0;
const money = (v, cur) => cur === 'USD' ? usd(v) : brl(v);
const brl4 = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 4 });
const pct = (v, d = 1) => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
function num(s) {
  if (typeof s === 'number') return isFinite(s) ? s : 0;
  s = String(s ?? '').trim().replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function curMonth() { return todayStr().slice(0, 7); }
function addMonths(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(mo)}`; }
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mlabel = m => { const [y, mo] = m.split('-'); return `${MESES[+mo - 1]}/${y.slice(2)}`; };
const monthNum = m => +m.split('-')[1];

/* =========================================================
   Estado: migração da versão antiga + normalização
   ========================================================= */
function migrate(raw) {
  const v = raw.vault || {};
  const old = {
    mpGiro: v.mpGiroBalance ?? 0, c99conta: v.pay99ContaBalance ?? 0,
    c99cof: v.pay99CofrinhoBalance ?? v.pay99Balance ?? 0,
    meli: v.cofrinhoMeliBalance ?? 0, pont: v.cofrinhoPontuaisBalance ?? 0,
    turbo: v.cofrinhoTurboBalance ?? 0, cdb: v.cdb102Balance ?? 0
  };
  const accounts = [
    { id: 'mp_giro', name: 'Giro Mercado Pago (Débito/Pix)', inst: 'Mercado Pago', balance: old.mpGiro, tiers: [{ upTo: null, pct: 105 }], taxed: true, target: v.mpGiroTarget || 1000 },
    { id: 'c99_conta', name: 'Conta 99Pay', inst: '99Pay', balance: old.c99conta, tiers: [{ upTo: 5000, pct: 115 }, { upTo: null, pct: 80 }], taxed: false, target: 5000 },
    { id: 'c99_cof', name: 'Cofrinho 99Pay', inst: '99Pay', balance: old.c99cof, tiers: [{ upTo: 5000, pct: 127 }, { upTo: null, pct: 80 }], taxed: false, target: 5000 },
    { id: 'mp_meli', name: v.cofrinhoMeliName || 'Cofrinho MP Mercado Livre', inst: 'Mercado Pago', balance: old.meli, tiers: [{ upTo: 2000, pct: 140 }, { upTo: null, pct: 100 }], taxed: true, target: 2000 },
    { id: 'mp_pont', name: v.cofrinhoPontuaisName || 'Cofrinho MP Reservas Imediatas', inst: 'Mercado Pago', balance: old.pont, tiers: [{ upTo: 8000, pct: 120 }, { upTo: null, pct: 100 }], taxed: true, target: 8000 },
    { id: 'turbo', name: 'Cofrinho Turbo', inst: 'NuBank', balance: old.turbo, tiers: [{ upTo: 5000, pct: 115 }, { upTo: null, pct: 100 }], taxed: true, target: 5000 },
    { id: 'cdb102', name: 'Mercado Pago CDB 102% CDI', inst: 'Mercado Pago', balance: old.cdb, tiers: [{ upTo: null, pct: 102 }], taxed: true, target: v.cdb102Target || 30000 }
  ];
  const tesouro = toArr(raw.tesouroTitles);
  const allocs = toArr(raw.allocations);
  const planOf = id => { const a = allocs.find(x => x.id === id); return a ? Number(a.amount) || 0 : null; };
  const month = raw.selectedMonth || curMonth();
  const s = {
    v: 2, selectedMonth: month, updatedAt: 1,
    cdiRateAnnual: raw.cdiRateAnnual || 13.15, irRate: 17.5,
    incomeSources: [
      { id: 'src_capes', name: 'Bolsa Capes (Doutorado)', amount: 3200, start: '2026-11', end: '2027-05' },
      { id: 'src_proj_a', name: 'Projetos com término em Out/27', amount: 6350, start: '2026-11', end: '2027-10' },
      { id: 'src_proj_b', name: 'Último projeto', amount: 5000, start: '2026-11', end: '2028-01' }
    ],
    incomeOverrides: {},
    expenses: toArr(raw.expenses).map(e => ({ id: e.id, label: e.label, amount: Number(e.amount) || 0 })),
    accounts,
    tesouro: tesouro.map(t => ({
      id: t.id, name: t.name, amount: Number(t.amount) || 0, rate: t.rate || '', blocked: !!t.blocked,
      coupon: /juros semestrais/i.test(t.name || ''), couponMonths: [5, 11], couponOverride: null
    })),
    fiis: { trades: [], quotes: {}, divs: {} },
    aportes: [],
    plan: { amort: planOf('alloc_amort') ?? 2000, tesouro: planOf('alloc_ipca32') ?? 3900, fii: 0 },
    amortAccumulated: v.amortAccumulated || 0,
    cushionTarget: v.cushionTarget || 100000,
    projSavePct: 100,
    lastCompound: todayStr(),
    yieldByMonth: {}, snapshots: {}
  };
  if (raw.activePhase === 0 && raw.income) s.incomeOverrides[month] = Number(raw.income);
  // aportes já marcados no mês pela versão antiga (os saldos já os incluem, então não mexem em saldo)
  const catOf = { alloc_amort: 'amort', alloc_ipca32: 'tesouro', alloc_giro: 'caixa', alloc_cdb: 'caixa' };
  allocs.forEach(a => {
    const val = Number(a.currentAmount) || 0;
    if (val > 0 && catOf[a.id]) s.aportes.push({ id: uid('ap'), date: todayStr(), cat: catOf[a.id], kind: 'legacy', target: '', label: a.name, amount: val });
  });
  return s;
}

function normalize(raw) {
  let s = (raw && raw.v >= 2) ? raw : migrate(raw || {});
  s.selectedMonth = s.selectedMonth || curMonth();
  s.incomeSources = toArr(s.incomeSources);
  s.incomeOverrides = (s.incomeOverrides && typeof s.incomeOverrides === 'object') ? s.incomeOverrides : {};
  s.expenses = toArr(s.expenses);
  s.accounts = toArr(s.accounts).map(a => ({ ...a, tiers: toArr(a.tiers), tiersAfter: toArr(a.tiersAfter), earned: a.earned || {} }));
  s.tesouro = toArr(s.tesouro).map(t => ({ ...t, couponMonths: toArr(t.couponMonths) }));
  s.fiis = s.fiis || {};
  s.fiis.trades = toArr(s.fiis.trades);
  s.fiis.quotes = s.fiis.quotes || {};
  s.fiis.divs = s.fiis.divs || {};
  s.aportes = toArr(s.aportes);
  s.proventos = toArr(s.proventos);
  s.analises = toArr(s.analises);
  if (!s.mercado) s.mercado = { ifixPVP: 0.82, ifixDY: 13.45, at: '2026-11-11' };   // valores do painel que você fotografou; edite em Análise
  s.fx = (s.fx && typeof s.fx === 'object') ? s.fx : { rate: 0, at: 0, manual: false };
  s.plan = s.plan || { amort: 2000, tesouro: 3900, fii: 0 };
  s.yieldByMonth = s.yieldByMonth || {};
  s.snapshots = s.snapshots || {};
  s.cdiRateAnnual = s.cdiRateAnnual || 13.15;

function srcFactor(x, m) {

  const from = s.length === 10 && s.slice(0, 7) === m ? +s.slice(8) : 1, to = e.length === 10 && e.slice(0, 7) === m ? +e.slice(8) : dim;

    if (!confirm(`Desfazer o aporte de ${brl(a.amount)}? O saldo do destino será revertido.`)) return;
    if (a.kind === 'account') { const x = state.accounts.find(c => c.id === a.target); if (x) x.balance = Math.max(0, x.balance - a.amount); }
    if (a.kind === 'tesouro') { const x = state.tesouro.find(c => c.id === a.target); if (x) x.amount = Math.max(0, x.amount - a.amount); }
    if (a.kind === 'amort') state.amortAccumulated = Math.max(0, state.amortAccumulated - a.amount);

  /* ---- caixa ---- */
  addAccount() { accountForm(); },
  editAccount(id) { accountForm(state.accounts.find(a => a.id === id)); },
  delAccount(id) { const a = state.accounts.find(x => x.id === id); if (a && confirm(`Remover "${a.name}" (${brl(a.balance)})?`)) { state.accounts = state.accounts.filter(x => x.id !== id); save(); } },

  },
  retirarAccount(id) {

    openForm({ title: 'Amortização acumulada do financiamento', fields: [{ k: 'v', label: 'Total já amortizado (R$)', value: state.amortAccumulated }],

  },

  addTrade(side) { tradeForm(side === 'V' ? 'V' : 'C'); },
  delTrade(id) {

    if (!confirm(`Remover a ${t.side === 'V' ? 'venda' : 'compra'} de ${t.qty} ${t.ticker}?`)) return;
    const k = t.fx || 1;
    if (t.debit) { const acc = state.accounts.find(a => a.id === t.debit); if (acc) acc.balance += k * (t.side === 'V' ? -(t.qty * t.price - (t.fees || 0)) : (t.qty * t.price + (t.fees || 0))); }
    state.fiis.trades = state.fiis.trades.filter(x => x.id !== id);
    state.aportes = state.aportes.filter(a => a.tradeId !== id);
    save(); toast('Operação removida');

  editFii(ticker) {
    const p = fiiPositions().find(x => x.ticker === ticker); if (!p) return;

      fields: [{ k: 'price', label: `Preço atual (${sym})`, value: p.hasQuote ? p.price.toFixed(2).replace('.', ',') : '' },
               { row: [{ k: 'dps', label: `Último provento por cota (${sym})`, value: p.dps ? p.dps.toFixed(4).replace('.', ',') : '' }, { k: 'freq', label: 'Pagamentos por ano', type: 'number', step: '1', value: p.freq, hint: 'FII: 12 · EUA: 4 · ações BR: 2 a 4' }] }],
      onSubmit(v) {
        const key = tkKey(ticker);
        if (String(v.price).trim()) state.fiis.quotes[key] = { price: num(v.price), change: null, at: Date.now(), manual: true };
        if (String(v.dps).trim()) state.fiis.divs[key] = { value: num(v.dps), freq: Math.max(1, Math.round(num(v.freq)) || p.freq), date: todayStr(), manual: true };
        else if (state.fiis.divs[key]) state.fiis.divs[key].freq = Math.max(1, Math.round(num(v.freq)) || p.freq);
        save(); toast('Atualizado');
      } });

  addProvento() {
    const pos = fiiPositions(); if (!pos.length) { toast('Registre uma compra primeiro'); return; }
    openForm({ title: 'Registrar provento recebido', note: 'Dividendos, rendimentos de FII ou JCP. Isso atualiza o “provento por cota” usado na estimativa e guarda o histórico do que você recebeu.',
      fields: [{ k: 'tk', label: 'Ativo', type: 'select', value: pos[0].ticker, options: pos.map(p => [p.ticker, `${p.ticker} (${p.qty} ${p.qty === 1 ? 'cota' : 'cotas'})`]) },
               { row: [{ k: 'ps', label: 'Valor por cota (moeda do ativo)', required: true }, { k: 'd', label: 'Data', type: 'date', value: todayStr() }] },
               { k: 'tot', label: 'Valor líquido recebido (R$) — opcional', hint: 'Se vazio, calculo cotas × valor (ativos dos EUA: líquido de 30% retido, convertido pelo dólar de hoje).' },
               { k: 'cred', label: 'Creditar em qual conta?', type: 'select', value: invAcc(), options: accOptions(true) }],
      onSubmit(v) {
        const p = pos.find(x => x.ticker === v.tk), ps = num(v.ps); if (!p || ps <= 0) { toast('Informe o valor por cota'); return false; }
        const isUS = p.cur === 'USD'; if (isUS && !p.k && !String(v.tot).trim()) { toast('Informe o valor recebido em R$ (dólar indisponível)'); return false; }
        const total = String(v.tot).trim() ? num(v.tot) : p.qty * ps * p.k * (isUS ? 0.70 : 1);
        state.proventos.push({ id: uid('pv'), date: v.d || todayStr(), ticker: p.ticker, perShare: ps, qty: p.qty, cur: p.cur, total, credit: v.cred || '' });
        const key = tkKey(p.ticker); state.fiis.divs[key] = { value: ps, freq: (state.fiis.divs[key] && state.fiis.divs[key].freq) || p.freq, date: v.d || todayStr(), manual: true };
        if (v.cred) { const acc = state.accounts.find(a => a.id === v.cred); if (acc) acc.balance = (acc.balance || 0) + total; }
        save(); toast(`Provento de ${brl(total)} registrado`);
      } });
  },
  delProvento(id) {
    const x = state.proventos.find(a => a.id === id); if (!x || !confirm(`Remover o provento de ${brl(x.total)} (${x.ticker})?`)) return;
    if (x.credit) { const acc = state.accounts.find(a => a.id === x.credit); if (acc) acc.balance = Math.max(0, acc.balance - x.total); }
    state.proventos = state.proventos.filter(a => a.id !== id); save(); toast('Provento removido');
  },
  refreshQuotes() { refreshQuotes(false); },

  /* ---- projeção ---- */
  setSavePct(_, el) { state.projSavePct = Math.max(0, Math.min(100, num(el.value))); save(); },

  /* ---- configurações ---- */
  settings() { settingsSheet(); },
  recoverOld() { recoverLegacy(false); },
  exportJSON() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `investimentos_backup_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); toast('Backup exportado');
  },
  importJSON() { $('importFile').click(); },
  logout() { closeSheet(); if (fb) firebase.auth().signOut(); }
};

function sourceForm(src) {
  const isNew = !src; src = src || { name: '', amount: '', start: curMonth() + '-01', end: '', prop: '1' };
  const asDate = (d, last) => !d ? '' : d.length === 10 ? d : (last ? (() => { const [y, mo] = d.split('-').map(Number); return d + '-' + pad(new Date(y, mo, 0).getDate()); })() : d + '-01');
  openForm({ title: isNew ? 'Nova fonte de renda' : 'Editar fonte de renda', note: 'Cadastre cada bolsa/projeto separadamente. Informe o dia em que começa e termina: no primeiro e no último mês o valor é pago proporcional aos dias (ex.: começa dia 16 de um mês de 30 dias = 15/30 do valor).',
    fields: [{ k: 'n', label: 'Nome (ex: Projeto X)', value: src.name, required: true }, { k: 'v', label: 'Valor líquido mensal (R$)', value: src.amount },
             { row: [{ k: 's', label: 'Início (data)', type: 'date', value: asDate(src.start, false) }, { k: 'e', label: 'Fim (data)', type: 'date', value: asDate(src.end, true), hint: 'Vazio = sem fim' }] },
             { k: 'prop', label: 'Primeiro e último mês', type: 'select', value: src.prop === '0' ? '0' : '1', options: [['1', 'Pagar proporcional aos dias'], ['0', 'Pagar o mês cheio']] }],
    onSubmit(v) {
      if (!v.n.trim()) return false;
      const data = { name: v.n.trim(), amount: num(v.v), start: v.s || '', end: v.e || '', prop: v.prop === '0' ? '0' : '1' };

      save();
    } });
}
const invAcc = () => { const a = state.accounts.find(x => x.inv); return a ? a.id : ''; };   // conta de investimentos: recebe proventos e paga compras por padrão

    fields: [{ k: 'n', label: 'Nome', value: acc.name, required: true },
             { row: [{ k: 'inst', label: 'Instituição', value: acc.inst }, ...(isNew ? [{ k: 'bal', label: 'Saldo atual (R$)', value: '' }] : [{ k: 'tgt', label: 'Meta de saldo (opcional)', value: acc.target ?? '' }])] },
             { row: [{ k: 'p1', label: 'Rende (% do CDI)', value: t[0] ? t[0].pct : '100', type: 'number' }, { k: 'lim', label: 'Até o valor de (R$)', value: t[0] && t[0].upTo != null ? t[0].upTo : '', hint: 'Vazio = sem limite' }] },
             { k: 'p2', label: 'Acima do limite rende (% do CDI)', value: t[1] ? t[1].pct : '', type: 'number' },
             { row: [{ k: 'until', label: 'Essa taxa vale até (opcional)', type: 'date', value: acc.until || '', hint: 'Ex.: cofrinho promocional até fevereiro' }, { k: 'pa', label: 'Depois disso rende (% do CDI)', type: 'number', value: toArr(acc.tiersAfter)[0] ? toArr(acc.tiersAfter)[0].pct : '' }] },
             { row: [{ k: 'mat', label: 'Vencimento do CDB (opcional)', type: 'date', value: acc.mat || '' }, { k: 'cap', label: 'Máximo que a conta aceita (R$)', value: acc.cap ?? '', hint: 'Vazio = sem teto. Aportes acima dele são recusados.' }] },

             { k: 'tax', label: 'Sofre IR sobre o rendimento?', type: 'select', value: acc.taxed ? '1' : '0', options: [['1', 'Sim (CDB, cofrinhos em geral)'], ['0', 'Não (isento)']] }],
    onSubmit(v) {

      const pa = String(v.pa).trim() === '' ? 0 : num(v.pa);

      if (data.inv) state.accounts.forEach(x => { if (x !== acc) x.inv = false; });   // só uma conta de investimentos
      if (isNew) state.accounts.push({ id: uid('acc'), balance: num(v.bal), target: null, ...data });

function aporteForm(preset) {
  const opts = [...state.accounts.map(a => [`account:${a.id}`, `Caixa — ${a.name}`]),
                ...state.tesouro.filter(t => !t.blocked).map(t => [`tesouro:${t.id}`, `Tesouro — ${t.name}`]),
                ['amort:', 'Amortização do financiamento']];
  openForm({ title: 'Registrar aporte', note: 'O valor entra no saldo do destino escolhido e conta na meta do mês. Para FIIs, ações e ETFs use “Registrar compra” na aba Ações & FIIs.',
    fields: [{ k: 'dest', label: 'Destino', type: 'select', value: preset || opts[0][0], options: opts },
             { row: [{ k: 'v', label: 'Valor (R$)', value: '', required: true }, { k: 'd', label: 'Data', type: 'date', value: todayStr() }] }],
    onSubmit(v) {
      const amount = num(v.v); if (amount <= 0) { toast('Informe um valor'); return false; }
      const [kind, target] = v.dest.split(':'); let label = '', cat = '';
      if (kind === 'account') { const a = state.accounts.find(x => x.id === target); if (a.cap > 0 && (a.balance || 0) + amount > a.cap + 0.005) { toast(`${a.name} aceita no máximo ${brl(a.cap)}: cabem mais ${brl(Math.max(0, a.cap - (a.balance || 0)))}`); return false; } a.balance = (a.balance || 0) + amount; label = a.name; cat = 'caixa'; }
      if (kind === 'tesouro') { const t = state.tesouro.find(x => x.id === target); t.amount = (t.amount || 0) + amount; label = t.name; cat = 'tesouro'; }
      if (kind === 'amort') { state.amortAccumulated += amount; label = 'Amortização do financiamento'; cat = 'amort'; }
      state.aportes.push({ id: uid('ap'), date: v.d || todayStr(), cat, kind, target, label, amount });
      save(); toast(`Aporte de ${brl(amount)} registrado`);
    } });
}
function tradeForm(side) {
  openForm({ title: side === 'V' ? 'Registrar venda' : 'Registrar compra', note: 'Informe como aparece na nota de corretagem. O preço médio é calculado automaticamente. Para ativos dos EUA, o preço é em dólar.',
    fields: [{ row: [{ k: 'cl', label: 'Tipo de ativo', type: 'select', value: 'fii', options: Object.entries(CLASSES).map(([k, c]) => [k, c.l]) }, { k: 'sd', label: 'Operação', type: 'select', value: side, options: [['C', 'Compra'], ['V', 'Venda']] }] },
             { row: [{ k: 'tk', label: 'Ticker', placeholder: 'MXRF11, PETR4, VOO…', required: true }, { k: 'q', label: 'Quantidade', type: 'number', step: '1', required: true }] },
             { row: [{ k: 'p', label: 'Preço unitário (R$ ou US$)', required: true }, { k: 'fee', label: 'Taxas (mesma moeda)', value: '0' }] },
             { row: [{ k: 'd', label: 'Data', type: 'date', value: todayStr() }, { k: 'fx', label: 'Dólar do dia (só EUA)', value: fxRate() ? fxRate().toFixed(4).replace('.', ',') : '' }] },
             { k: 'deb', label: 'Debitar o valor de qual conta?', type: 'select', value: invAcc(), options: accOptions(true), hint: 'Opcional — se escolher, o saldo da conta é ajustado (em R$).' }],
    onSubmit(v) {
      const tk = v.tk.trim().toUpperCase(), cl = clsOf(v.cl), isUS = cl.cur === 'USD';
      const q = Math.round(num(v.q)), p = num(v.p), fees = num(v.fee), k = isUS ? num(v.fx) : 1;
      if (!/^[A-Z0-9.\-]{1,10}$/.test(tk)) { toast('Ticker inválido (ex: MXRF11, VOO)'); return false; }
      if (q <= 0 || p <= 0) { toast('Informe quantidade e preço'); return false; }
      if (isUS && !(k > 0)) { toast('Informe o dólar do dia para ativos dos EUA'); return false; }
      if (v.sd === 'V') { const pos = fiiPositions().find(x => x.ticker === tk); if (!pos || pos.qty < q) { toast(`Você tem ${pos ? pos.qty : 0} de ${tk}`); return false; } }
      const id = uid('tr'), total = q * p;
      state.fiis.trades.push({ id, ticker: tk, cls: v.cl, cur: cl.cur, fx: isUS ? k : 1, side: v.sd, date: v.d || todayStr(), qty: q, price: p, fees, debit: v.deb || '' });
      if (isUS && !fxRate()) state.fx = { rate: k, at: Date.now(), manual: false };
      if (v.deb) { const acc = state.accounts.find(a => a.id === v.deb); if (acc) acc.balance = Math.max(0, (acc.balance || 0) + k * (v.sd === 'V' ? total - fees : -(total + fees))); }
      if (v.sd === 'C') state.aportes.push({ id: uid('ap'), date: v.d || todayStr(), cat: 'fii', kind: 'fii', target: tk, label: `${cl.l} ${tk} (${q})`, amount: (total + fees) * k, tradeId: id });
      save(); toast(`${v.sd === 'V' ? 'Venda' : 'Compra'} de ${q} ${tk} registrada`);
      refreshQuotes(true);
    } });
}

/* =========================================================
   Cotações — B3 via brapi.dev (1 ativo por consulta no plano gratuito),
   EUA via Finnhub, dólar via AwesomeAPI. Tudo opcional: dá para digitar à mão.
   ========================================================= */
async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function errReason(e, src) {
  const s = e && e.status;
  if (s === 401 || s === 403) return src === 'us' ? 'chave do Finnhub inválida' : 'token da brapi ausente ou inválido';
  if (s === 402) return 'o plano da brapi não inclui este ativo';
  if (s === 404) return 'ticker não encontrado';
  if (s === 429) return 'limite de consultas (tente em 1 min)';
  if (!s) return 'sem conexão ou bloqueio do navegador';
  return 'erro ' + s;
}
/* B3: os preços vêm do quotes.json, gravado pelo robô do GitHub Actions (que usa a chave da brapi guardada como Secret). */
async function loadRobot() {
  try { const r = await fetch('./quotes.json?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
async function quoteUS(tk, key) {
  const j = await getJSON(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(tk)}&token=${encodeURIComponent(key)}`);
  if (!j || !(Number(j.c) > 0)) { const e = new Error('sem preço'); e.status = 404; throw e; }
  return { price: Number(j.c), change: isFinite(Number(j.dp)) ? Number(j.dp) : null };
}
async function fetchFx() {
  const j = await getJSON('https://economia.awesomeapi.com.br/json/last/USD-BRL');
  const r = Number(j && j.USDBRL && j.USDBRL.bid); if (!(r > 0)) throw new Error('sem câmbio'); return r;
}
let refreshing = false;
async function refreshQuotes(silent) {
  if (refreshing) return;
  const pos = fiiPositions();
  if (!pos.length) { if (!silent) toast('Registre uma compra primeiro'); return; }
  const keyU = localStorage.getItem(FK) || '', robot = pos.some(p => p.cl.src !== 'us') ? await loadRobot() : null;
  refreshing = true; uiMsg.quotes = 'Atualizando cotações…'; if (tab === 'fiis') render();
  let ok = 0, changed = false; const fails = [];
  if (pos.some(p => p.cur === 'USD') && !(state.fx && state.fx.manual)) {
    try { state.fx = { rate: await fetchFx(), at: Date.now(), manual: false }; changed = true; } catch (e) { fails.push('dólar: ' + errReason(e, 'fx')); }
  }
  for (const p of pos) {
    const src = p.cl.src;
    try {
      let q;
      if (src === 'us') { if (!keyU) { fails.push(`${p.ticker}: falta a chave do Finnhub (⚙)`); continue; } q = await quoteUS(p.ticker, keyU); }
      else {
        const r = robot && robot.quotes && robot.quotes[p.ticker.toUpperCase()];
        if (!r || !(Number(r.price) > 0)) { fails.push(`${p.ticker}: ${robot ? 'não está em tickers.json (robô) ou sem preço' : 'robô ainda não publicou o quotes.json'}`); continue; }
        q = { price: Number(r.price), change: isFinite(Number(r.change)) && r.change !== null ? Number(r.change) : null };
      }
      state.fiis.quotes[tkKey(p.ticker)] = { price: q.price, change: q.change, at: Date.now() }; ok++; changed = true;
    } catch (e) { fails.push(`${p.ticker}: ${errReason(e, src)}`); if (e.status === 429) await sleep(1500); }
  }
  // proventos vindos do robô (nunca sobrescrevem o que você digitou à mão)
  if (robot && robot.dividends) {
    const yearAgo = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
    pos.filter(p => p.cl.src !== 'us').forEach(p => {
      const list = toArr(robot.dividends[p.ticker.toUpperCase()]).filter(d => Number(d.rate) > 0); if (!list.length) return;
      const key = tkKey(p.ticker), cur = state.fiis.divs[key]; if (cur && cur.manual) return;
      const d = p.cls === 'fii' ? { value: Number(list[0].rate), freq: 12, date: list[0].paymentDate || '' }
        : { value: list.filter(x => (x.paymentDate || '') >= yearAgo).reduce((t, x) => t + Number(x.rate), 0), freq: 1, date: list[0].paymentDate || '' };   // ações/ETFs: soma dos últimos 12 meses
      if (d.value > 0) { state.fiis.divs[key] = { ...d, manual: false }; changed = true; }
    });
  }
  if (robot && robot.updatedAt && Date.now() - Date.parse(robot.updatedAt) > 36 * 36e5) fails.push('o robô não atualiza há mais de 1 dia (veja a aba Actions no GitHub)');
  refreshing = false;
  const hh = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  uiMsg.quotes = (ok ? `Cotações atualizadas às ${hh} (${ok} de ${pos.length})` : 'Não consegui atualizar nenhuma cotação') + (fails.length ? ' — falhas: ' + fails.join('; ') : '') + '. Digite à mão em “Editar” se precisar.';
  if (changed) save(); else render();
  if (!silent) toast(ok ? 'Cotações atualizadas' : 'Cotações indisponíveis');
}
function marketOpen() { const d = new Date(), w = d.getDay(), h = d.getHours() + d.getMinutes() / 60; return w >= 1 && w <= 5 && h >= 9.9 && h <= 19; }
// relê o quotes.json a cada 15 min no horário de pregão
setInterval(() => { if (document.visibilityState === 'visible' && marketOpen() && !gateLocked && fiiPositions().length) refreshQuotes(true); }, 15 * 60 * 1000);
