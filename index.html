<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Investimentos Bernardy</title>

<link rel="icon" type="image/png" href="./brasao.png" />
<link rel="shortcut icon" href="./brasao.png" />
<link rel="apple-touch-icon" href="./brasao.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Investimentos Bernardy" />
<meta name="theme-color" content="#0a1020" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Investimentos Bernardy","short_name":"Investimentos","start_url":"./","display":"standalone","background_color":"%230a1020","theme_color":"%230a1020","icons":[{"src":"./brasao.png","sizes":"192x192 512x512","type":"image/png"}]}' />

<style>
  :root{
    --bg:#0a1020; --card:#111a2e; --card2:#0d1527; --line:#1f2b46; --text:#e7edf8; --mut:#8c9ab5; --mut2:#5f6e8c;
    --brand:#10b981; --brand-d:#059669; --amber:#f5b13d; --cyan:#22d3ee; --rose:#fb7185; --violet:#a78bfa; --blue:#60a5fa;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;font-size:14px}
  .num{font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  /* header */
  header{position:sticky;top:0;z-index:30;background:rgba(10,16,32,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{width:36px;height:36px;object-fit:contain;border-radius:10px;background:#060b17;border:1px solid var(--line);padding:3px}
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .brand small{display:block;color:var(--mut);font-size:11px}
  .hright{display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--mut);cursor:pointer}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .pill.on .dot{background:var(--brand)} .pill.off .dot{background:var(--rose)}
  input[type=month]{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--text);font-size:12px;color-scheme:dark}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}

  main{padding:20px 0 60px}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .card h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 .sub{font-weight:500;color:var(--mut);font-size:12px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
  .big{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .hint{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.4}
  .green{color:var(--brand)} .amber{color:var(--amber)} .cyan{color:var(--cyan)} .rose{color:var(--rose)} .violet{color:var(--violet)} .blue{color:var(--blue)} .mut{color:var(--mut)}

  .btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:#334566;background:#142038}
  .btn.primary{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
  .btn.primary:hover{background:var(--brand)}
  .btn.sm{padding:4px 9px;font-size:11.5px;border-radius:8px}
  .btn.ghost{background:none}
  .btn.danger:hover{border-color:#7f1d2e;color:var(--rose)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}

  .bar{height:7px;background:#1a2540;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s}
  .item{padding:12px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0;padding-top:0}
  .item .name{font-weight:600;font-size:13.5px}
  .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px;font-weight:600;vertical-align:middle}
  .tag.g{color:var(--brand);border-color:#12503c} .tag.a{color:var(--amber);border-color:#5a4318}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--mut);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
  td{padding:9px 10px;border-bottom:1px solid #18233b;text-align:right;white-space:nowrap}
  th:first-child,td:first-child,.l{text-align:left}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}
  .empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--line);border-radius:12px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(3,6,14,.75);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal.hidden{display:none}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:20px}
  .sheet h3{margin:0 0 14px;font-size:15px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;outline:none;color-scheme:dark}
  .field input:focus,.field select:focus{border-color:var(--brand)}
  .field .hint{margin-top:4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .inl{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right;font-size:13px;color-scheme:dark}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16223a;border:1px solid #2a3a5e;padding:9px 16px;border-radius:12px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}

  .stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#1a2540}
  .stack i{display:block;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
  .legend b{color:var(--text);font-weight:600}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}

  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px;overflow-x:auto}
  .chart .col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .chart .bars{display:flex;align-items:flex-end;gap:2px;height:118px;width:100%;justify-content:center}
  .chart .bars i{display:block;width:42%;max-width:14px;border-radius:3px 3px 0 0;min-height:1px}
  .chart small{font-size:10px;color:var(--mut)}
  @media (max-width:520px){ .big{font-size:19px} .brand small{display:none} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">
        <img src="./brasao.png" alt="" onerror="this.style.display='none'" />
        <div><h1>Investimentos Bernardy</h1><small>Organização financeira consciente</small></div>
      </div>
      <div class="hright">
        <input type="month" id="month" title="Mês de referência" />
        <button class="pill" id="syncPill" data-act="settings" title="Sincronização e configurações"><span class="dot"></span><span id="syncTxt">Local</span></button>
        <button class="btn sm" data-act="settings" title="Configurações">⚙</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

<script>
/* =========================================================
   Chaves de armazenamento (as mesmas da versão anterior)
   ========================================================= */
const SK = 'FINANCE_ALLOCATOR_DATA_PERMANENT';
const CK = 'FINANCE_CLOUD_SYNC_BIN_ID';
const TK = 'FINANCE_BRAPI_TOKEN';      // token de cotações: fica SÓ neste aparelho (não vai pro Firebase)
const BK = 'FINANCE_BACKUP_PRE_V2';
const TABK = 'FINANCE_LAST_TAB';

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl4 = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 4 });
const pct = (v, d = 1) => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
function num(s) {
  if (typeof s === 'number') return isFinite(s) ? s : 0;
  s = String(s ?? '').trim().replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function curMonth() { return todayStr().slice(0, 7); }
function addMonths(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(mo)}`; }
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mlabel = m => { const [y, mo] = m.split('-'); return `${MESES[+mo - 1]}/${y.slice(2)}`; };
const monthNum = m => +m.split('-')[1];

/* =========================================================
   Estado: migração da versão antiga + normalização
   ========================================================= */
function migrate(raw) {
  const v = raw.vault || {};
  const old = {
    mpGiro: v.mpGiroBalance ?? 12.11, c99conta: v.pay99ContaBalance ?? 0,
    c99cof: v.pay99CofrinhoBalance ?? v.pay99Balance ?? 6513.41,
    meli: v.cofrinhoMeliBalance ?? 2000, pont: v.cofrinhoPontuaisBalance ?? 8000,
    turbo: v.cofrinhoTurboBalance ?? 5088.24, cdb: v.cdb102Balance ?? 11222.77
  };
  const accounts = [
    { id: 'mp_giro', name: 'Giro Mercado Pago (Débito/Pix)', inst: 'Mercado Pago', balance: old.mpGiro, tiers: [{ upTo: null, pct: 105 }], taxed: true, target: v.mpGiroTarget || 1000 },
    { id: 'c99_conta', name: 'Conta 99Pay', inst: '99Pay', balance: old.c99conta, tiers: [{ upTo: 5000, pct: 115 }, { upTo: null, pct: 80 }], taxed: false, target: 5000 },
    { id: 'c99_cof', name: 'Cofrinho 99Pay', inst: '99Pay', balance: old.c99cof, tiers: [{ upTo: 5000, pct: 127 }, { upTo: null, pct: 80 }], taxed: false, target: 5000 },
    { id: 'mp_meli', name: v.cofrinhoMeliName || 'Cofrinho MP Mercado Livre', inst: 'Mercado Pago', balance: old.meli, tiers: [{ upTo: 2000, pct: 140 }, { upTo: null, pct: 100 }], taxed: true, target: 2000 },
    { id: 'mp_pont', name: v.cofrinhoPontuaisName || 'Cofrinho MP Reservas Imediatas', inst: 'Mercado Pago', balance: old.pont, tiers: [{ upTo: 8000, pct: 120 }, { upTo: null, pct: 100 }], taxed: true, target: 8000 },
    { id: 'turbo', name: 'Cofrinho Turbo', inst: 'NuBank', balance: old.turbo, tiers: [{ upTo: 5000, pct: 115 }, { upTo: null, pct: 100 }], taxed: true, target: 5000 },
    { id: 'cdb102', name: 'Mercado Pago CDB 102% CDI', inst: 'Mercado Pago', balance: old.cdb, tiers: [{ upTo: null, pct: 102 }], taxed: true, target: v.cdb102Target || 30000 }
  ];
  const tesouro = toArr(raw.tesouroTitles).length ? toArr(raw.tesouroTitles) : [
    { id: 'tesouro_2045', name: 'Tesouro IPCA+ c/ Juros Semestrais 2045', amount: 4364.88, rate: 'IPCA + 6,77%', blocked: false },
    { id: 'tesouro_2055', name: 'Tesouro IPCA+ c/ Juros Semestrais 2055', amount: 6866.38, rate: 'IPCA + 6,34%', blocked: true },
    { id: 'tesouro_renda2055', name: 'Tesouro RendA+ 2055 (Aposentadoria)', amount: 6797.74, rate: 'IPCA + 6,70%', blocked: false }
  ];
  const allocs = toArr(raw.allocations);
  const planOf = id => { const a = allocs.find(x => x.id === id); return a ? Number(a.amount) || 0 : null; };
  const month = raw.selectedMonth || curMonth();
  const s = {
    v: 2, selectedMonth: month, updatedAt: 1,
    cdiRateAnnual: raw.cdiRateAnnual || 13.15, irRate: 17.5,
    incomeSources: [
      { id: 'src_capes', name: 'Bolsa Capes (Doutorado)', amount: 3200, start: '2026-11', end: '2027-05' },
      { id: 'src_proj_a', name: 'Projetos com término em Out/27', amount: 6350, start: '2026-11', end: '2027-10' },
      { id: 'src_proj_b', name: 'Último projeto', amount: 5000, start: '2026-11', end: '2028-01' }
    ],
    incomeOverrides: {},
    expenses: toArr(raw.expenses).length ? toArr(raw.expenses).map(e => ({ id: e.id, label: e.label, amount: Number(e.amount) || 0 })) : [
      { id: 'exp_agua', label: 'Água / Saneamento', amount: 80 }, { id: 'exp_net', label: 'Internet Fibra', amount: 99 },
      { id: 'exp_luz', label: 'Energia Elétrica', amount: 200 }, { id: 'exp_seg', label: 'Seguro do Carro', amount: 0 },
      { id: 'exp_cartao', label: 'Fatura do Cartão (Pessoal)', amount: 1500 }
    ],
    accounts,
    tesouro: tesouro.map(t => ({
      id: t.id, name: t.name, amount: Number(t.amount) || 0, rate: t.rate || '', blocked: !!t.blocked,
      coupon: /juros semestrais/i.test(t.name || ''), couponMonths: [5, 11], couponOverride: null
    })),
    fiis: { trades: [], quotes: {}, divs: {} },
    aportes: [],
    plan: { amort: planOf('alloc_amort') ?? 2000, tesouro: planOf('alloc_ipca32') ?? 3900, fii: 0 },
    amortAccumulated: v.amortAccumulated || 0,
    cushionTarget: v.cushionTarget || 100000,
    projSavePct: 100,
    lastCompound: todayStr(),
    yieldByMonth: {}, snapshots: {}
  };
  if (raw.activePhase === 0 && raw.income) s.incomeOverrides[month] = Number(raw.income);
  // aportes já marcados no mês pela versão antiga (os saldos já os incluem, então não mexem em saldo)
  const catOf = { alloc_amort: 'amort', alloc_ipca32: 'tesouro', alloc_giro: 'caixa', alloc_cdb: 'caixa' };
  allocs.forEach(a => {
    const val = Number(a.currentAmount) || 0;
    if (val > 0 && catOf[a.id]) s.aportes.push({ id: uid('ap'), date: todayStr(), cat: catOf[a.id], kind: 'legacy', target: '', label: a.name, amount: val });
  });
  return s;
}

function normalize(raw) {
  let s = (raw && raw.v >= 2) ? raw : migrate(raw || {});
  s.selectedMonth = s.selectedMonth || curMonth();
  s.incomeSources = toArr(s.incomeSources);
  s.incomeOverrides = (s.incomeOverrides && typeof s.incomeOverrides === 'object') ? s.incomeOverrides : {};
  s.expenses = toArr(s.expenses);
  s.accounts = toArr(s.accounts).map(a => ({ ...a, tiers: toArr(a.tiers) }));
  s.tesouro = toArr(s.tesouro).map(t => ({ ...t, couponMonths: toArr(t.couponMonths) }));
  s.fiis = s.fiis || {};
  s.fiis.trades = toArr(s.fiis.trades);
  s.fiis.quotes = s.fiis.quotes || {};
  s.fiis.divs = s.fiis.divs || {};
  s.aportes = toArr(s.aportes);
  s.plan = s.plan || { amort: 2000, tesouro: 3900, fii: 0 };
  s.yieldByMonth = s.yieldByMonth || {};
  s.snapshots = s.snapshots || {};
  s.cdiRateAnnual = s.cdiRateAnnual || 13.15;
  s.irRate = s.irRate ?? 17.5;
  s.projSavePct = s.projSavePct ?? 100;
  s.amortAccumulated = s.amortAccumulated || 0;
  s.cushionTarget = s.cushionTarget || 100000;
  return s;
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) {}
  if (raw && !(raw.v >= 2)) { try { localStorage.setItem(BK, JSON.stringify(raw)); } catch (e) {} } // backup da versão antiga
  return normalize(raw);
}

let state = loadState();
let tab = (() => { try { return localStorage.getItem(TABK) || 'resumo'; } catch (e) { return 'resumo'; } })();
let uiMsg = { quotes: '' };

/* =========================================================
   Persistência + Firebase (mesmo projeto e mesma chave de antes)
   ========================================================= */
let fb = null, pushTimer = null, fbConnected = false, synced = false;
const FB_CONFIG = {
  apiKey: "AIzaSyC8FicouZAv1ctKhrOAXic_hjN_dwFV85U", authDomain: "financias-ruan.firebaseapp.com",
  databaseURL: "https://financias-ruan-default-rtdb.firebaseio.com", projectId: "financias-ruan",
  storageBucket: "financias-ruan.firebasestorage.app", messagingSenderId: "491979861013",
  appId: "1:491979861013:web:35c7c1a7eb367f24e1f21c"
};
const syncKey = () => localStorage.getItem(CK) || 'ruan-invest-2026';

function setSyncPill() {
  const p = $('syncPill'), t = $('syncTxt');
  p.classList.remove('on', 'off');
  if (!fb) { t.textContent = 'Só neste aparelho'; return; }
  if (fbConnected) { p.classList.add('on'); t.textContent = 'Sincronizado'; }
  else { p.classList.add('off'); t.textContent = 'Offline'; }
}

function initFirebase() {
  if (typeof firebase === 'undefined') { setSyncPill(); return; }
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fb = firebase.database();
    fb.ref('.info/connected').on('value', s => { fbConnected = s.val() === true; setSyncPill(); });
    fb.ref('/' + syncKey()).on('value', snap => {
      const r = snap.val();
      if (!r) { pushNow(); }
      else if (!(r.v >= 2)) {            // dados na nuvem ainda no formato antigo: migra a partir deles
        if (state.updatedAt > 1) pushNow();
        else { const m = state.selectedMonth; state = normalize(r); state.selectedMonth = m; state.updatedAt = Date.now(); persistLocal(); pushNow(); render(); }
      } else {
        const rt = r.updatedAt || 0, lt = state.updatedAt || 0;
        if (rt > lt) { const m = state.selectedMonth; state = normalize(r); state.selectedMonth = m; persistLocal(); render(); }
        else if (lt > rt) pushNow();
      }
      firstSyncDone();
    });
  } catch (e) { console.error('Firebase:', e); }
  setSyncPill();
}
function firstSyncDone() { if (synced) return; synced = true; applyDailyCompound(true); render(); if (localStorage.getItem(TK) && fiiPositions().length) refreshQuotes(true); }
function persistLocal() { try { localStorage.setItem(SK, JSON.stringify(state)); } catch (e) {} }
function pushNow() {
  if (!fb) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { fb.ref('/' + syncKey()).set(JSON.parse(JSON.stringify(state))).catch(e => console.error(e)); }, 250);
}
function save(rerender = true, bump = true) {
  updateSnapshot();
  if (bump) state.updatedAt = Date.now();
  persistLocal();
  if (bump && synced) pushNow();
  if (rerender) render();
}
function updateSnapshot() {
  const m = curMonth();
  const t = totals();
  state.snapshots[m] = { patrimonio: Math.round(t.patrimonio * 100) / 100, caixa: Math.round(t.caixa), tesouro: Math.round(t.tesouro), fiis: Math.round(t.fiis), passivo: Math.round(passiveMonthly().total * 100) / 100 };
}

/* =========================================================
   Cálculos
   ========================================================= */
const cdi = () => (state.cdiRateAnnual || 13.15) / 100;
const liqOf = acc => acc.taxed ? 1 - (state.irRate ?? 17.5) / 100 : 1;

function tierSplit(balance, tiers) {
  tiers = toArr(tiers); if (!tiers.length) tiers = [{ upTo: null, pct: 100 }];
  let rem = Math.max(0, balance), prev = 0; const out = [];
  for (const t of tiers) {
    const cap = (t.upTo == null || t.upTo === '') ? Infinity : Number(t.upTo);
    const take = Math.min(rem, Math.max(0, cap - prev));
    if (take > 0) out.push({ amt: take, pct: Number(t.pct) || 0 });
    rem -= take; prev = cap; if (rem <= 0) break;
  }
  if (rem > 0) out.push({ amt: rem, pct: Number(tiers[tiers.length - 1].pct) || 0 });
  return out;
}
function accYield(acc, periods) {  // rendimento líquido em 1 período (mês: 12, dia útil: 252)
  const liq = liqOf(acc);
  return tierSplit(acc.balance || 0, acc.tiers).reduce((s, p) => s + p.amt * (Math.pow(1 + cdi() * p.pct / 100, 1 / periods) - 1) * liq, 0);
}
function accRateLabel(acc) {
  const t = toArr(acc.tiers);
  if (!t.length) return '—';
  if (t.length === 1 || t[0].upTo == null) return `${t[0].pct}% CDI`;
  return `${t[0].pct}% CDI até ${brl(t[0].upTo)} · depois ${t[1].pct}%`;
}

function businessDaysBetween(fromStr, toStr) {
  let d = new Date(fromStr + 'T12:00:00'); const end = new Date(toStr + 'T12:00:00'); let n = 0;
  while (true) { d.setDate(d.getDate() + 1); if (d > end) break; const w = d.getDay(); if (w !== 0 && w !== 6) n++; if (n > 4000) break; }
  return n;
}
function applyDailyCompound(bump = true) {
  const today = todayStr();
  if (!state.lastCompound) { state.lastCompound = today; save(false, bump); return; }
  if (state.lastCompound >= today) return;
  const n = businessDaysBetween(state.lastCompound, today);
  let gained = 0;
  for (let i = 0; i < Math.min(n, 400); i++) state.accounts.forEach(a => { const g = accYield(a, 252); a.balance = (a.balance || 0) + g; gained += g; });
  const m = curMonth();
  state.yieldByMonth[m] = (state.yieldByMonth[m] || 0) + gained;
  state.lastCompound = today;
  save(false, bump);
}

function incomeFor(m) {
  const ov = state.incomeOverrides[m];
  if (ov !== undefined && ov !== null && ov !== '') return { value: Number(ov) || 0, manual: true };
  const value = state.incomeSources.reduce((s, x) => s + ((!x.start || x.start <= m) && (!x.end || x.end >= m) ? Number(x.amount) || 0 : 0), 0);
  return { value, manual: false };
}
const totalExpenses = () => state.expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

function couponNet(t) {  // cupom semestral líquido (IR 15%) — ESTIMATIVA
  const gross = (t.couponOverride !== null && t.couponOverride !== undefined && t.couponOverride !== '') ? Number(t.couponOverride) : (t.amount || 0) * (Math.pow(1.06, 0.5) - 1);
  return gross * 0.85;
}
function couponsInMonth(m) {
  const mm = monthNum(m);
  return state.tesouro.filter(t => t.coupon && toArr(t.couponMonths).includes(mm)).reduce((s, t) => s + couponNet(t), 0);
}

function fiiPositions() {
  const trades = [...state.fiis.trades].sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.id > b.id ? 1 : -1));
  const map = {};
  for (const t of trades) {
    const p = map[t.ticker] || (map[t.ticker] = { ticker: t.ticker, qty: 0, cost: 0 });
    if (t.side === 'V') { const avg = p.qty > 0 ? p.cost / p.qty : 0; const q = Math.min(t.qty, p.qty); p.cost -= avg * q; p.qty -= q; }
    else { p.qty += t.qty; p.cost += t.qty * t.price + (t.fees || 0); }
  }
  return Object.values(map).filter(p => p.qty > 0).map(p => {
    const q = state.fiis.quotes[p.ticker], d = state.fiis.divs[p.ticker];
    const avg = p.cost / p.qty, hasQuote = !!(q && q.price > 0), price = hasQuote ? q.price : avg;
    const dps = d && d.value > 0 ? d.value : 0;
    return { ...p, avg, price, hasQuote, change: q ? q.change : null, quoteAt: q ? q.at : null, dps, divDate: d ? d.date : null,
      value: p.qty * price, pl: p.qty * price - p.cost, plPct: p.cost > 0 ? (p.qty * price / p.cost - 1) * 100 : 0,
      income: p.qty * dps, dyAnual: avg > 0 ? dps * 12 / avg * 100 : 0 };
  }).sort((a, b) => b.value - a.value);
}

function totals() {
  const caixa = state.accounts.reduce((s, a) => s + (a.balance || 0), 0);
  const tesouro = state.tesouro.reduce((s, t) => s + (t.amount || 0), 0);
  const pos = fiiPositions();
  const fiis = pos.reduce((s, p) => s + p.value, 0), fiisCost = pos.reduce((s, p) => s + p.cost, 0);
  return { caixa, tesouro, fiis, fiisCost, patrimonio: caixa + tesouro + fiis, pos };
}
function passiveMonthly() {
  const caixa = state.accounts.reduce((s, a) => s + accYield(a, 12), 0);
  const fii = fiiPositions().reduce((s, p) => s + p.income, 0);
  const cup = state.tesouro.filter(t => t.coupon).reduce((s, t) => s + couponNet(t) * toArr(t.couponMonths).length / 12, 0);
  return { caixa, fii, cupons: cup, total: caixa + fii + cup };
}
const aportesOfMonth = m => state.aportes.filter(a => (a.date || '').slice(0, 7) === m);

  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
}

             { row: [{ k: 'fee', label: 'Taxas/corretagem (R$)', value: '0' }, { k: 'd', label: 'Data', type: 'date', value: todayStr() }] },
             { k: 'deb', label: 'Debitar o valor de qual conta?', type: 'select', value: '', options: accOptions(true), hint: 'Opcional — se escolher, o saldo da conta é ajustado.' }],
    onSubmit(v) {

      if (!/^[A-Z0-9]{4,6}$/.test(tk)) { toast('Ticker inválido (ex: MXRF11)'); return false; }

      if (v.sd === 'V') { const pos = fiiPositions().find(x => x.ticker === tk); if (!pos || pos.qty < q) { toast(`Você tem ${pos ? pos.qty : 0} cotas de ${tk}`); return false; } }
      const id = uid('tr'), total = q * p;
      state.fiis.trades.push({ id, ticker: tk, side: v.sd, date: v.d || todayStr(), qty: q, price: p, fees, debit: v.deb || '' });
      if (v.deb) { const acc = state.accounts.find(a => a.id === v.deb); if (acc) acc.balance = Math.max(0, (acc.balance || 0) + (v.sd === 'V' ? total - fees : -(total + fees))); }
      if (v.sd === 'C') state.aportes.push({ id: uid('ap'), date: v.d || todayStr(), cat: 'fii', kind: 'fii', target: tk, label: `FII ${tk} (${q} cotas)`, amount: total + fees, tradeId: id });
      save(); toast(`${v.sd === 'V' ? 'Venda' : 'Compra'} de ${q} ${tk} registrada`);
      if (localStorage.getItem(TK)) refreshQuotes(true);
    } });
}

/* =========================================================
   Cotações (brapi.dev) — o token é opcional; sem ele, digite o preço à mão
   ========================================================= */
async function getJSON(url, token, bearer) {
  const r = await fetch(url, bearer && token ? { headers: { Authorization: 'Bearer ' + token } } : undefined);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function parseQuoteItems(j) {
  return toArr(j && j.results).map(it => { const d = it.data || it; return { symbol: (it.symbol || d.symbol || '').toUpperCase(), price: Number(d.regularMarketPrice), change: Number(d.regularMarketChangePercent) }; })
    .filter(x => x.symbol && x.price > 0);
}
let refreshing = false;
async function refreshQuotes(silent) {
  if (refreshing) return;
  const tickers = [...new Set(fiiPositions().map(p => p.ticker))];
  if (!tickers.length) { if (!silent) toast('Registre uma compra de FII primeiro'); return; }
  const token = localStorage.getItem(TK) || '';
  refreshing = true; uiMsg.quotes = 'Atualizando cotações…'; if (tab === 'fiis') render();
  const list = tickers.join(','); let items = [];
  const attempts = [
    () => getJSON(`https://brapi.dev/api/quote/${list}${token ? '?token=' + encodeURIComponent(token) : ''}`),
    () => getJSON(`https://brapi.dev/api/v2/stocks/quote?symbols=${list}`, token, true)
  ];
  for (const at of attempts) { try { items = parseQuoteItems(await at()); if (items.length) break; } catch (e) {} }
  if (items.length < tickers.length) { // plano gratuito pode limitar: tenta ticker por ticker
    for (const tk of tickers.filter(t => !items.find(i => i.symbol === t))) {
      try { items.push(...parseQuoteItems(await getJSON(`https://brapi.dev/api/quote/${tk}${token ? '?token=' + encodeURIComponent(token) : ''}`))); } catch (e) {}
    }
  }
  items.forEach(i => { state.fiis.quotes[i.symbol] = { price: i.price, change: isFinite(i.change) ? i.change : null, at: Date.now() }; });
  let divOk = 0;
  if (token) {
    try {
      const j = await getJSON(`https://brapi.dev/api/v2/fii/dividends?symbols=${list}`, token, true);
      const by = {};
      toArr(j && j.dividends).forEach(d => { const s = (d.symbol || '').toUpperCase(); if (!s || !(d.rate > 0)) return; if (!by[s] || (d.paymentDate || '') > (by[s].paymentDate || '')) by[s] = d; });
      Object.entries(by).forEach(([s, d]) => { const cur = state.fiis.divs[s]; if (!cur || !cur.manual) { state.fiis.divs[s] = { value: Number(d.rate), date: (d.paymentDate || '').slice(0, 10), manual: false }; divOk++; } });
    } catch (e) {}
  }
  refreshing = false;
  const hh = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  uiMsg.quotes = items.length ? `Cotações atualizadas às ${hh}${token ? '' : ' (sem token: pode falhar para alguns FIIs)'}` : (token ? 'Não consegui buscar as cotações agora. Digite o preço à mão (botão “Editar”) ou tente de novo.' : 'Para cotações automáticas, adicione seu token gratuito da brapi.dev em ⚙ Configurações. Enquanto isso, digite o preço à mão.');
  if (items.length) save(); else render();
  if (!silent) toast(items.length ? 'Cotações atualizadas' : 'Cotações indisponíveis');
}
function marketOpen() { const d = new Date(), w = d.getDay(), h = d.getHours() + d.getMinutes() / 60; return w >= 1 && w <= 5 && h >= 9.9 && h <= 18.6; }
setInterval(() => { if (document.visibilityState === 'visible' && localStorage.getItem(TK) && marketOpen() && fiiPositions().length) refreshQuotes(true); }, 5 * 60 * 1000);

    <div class="hint" style="margin:-6px 0 10px">${esc(uiMsg.quotes) || (token ? 'Cotações atualizam sozinhas a cada 5 min em horário de pregão, com esta página aberta.' : 'Adicione seu token gratuito da brapi.dev em ⚙ para cotações automáticas.')}</div>
    ${pos.length ? `<div class="scroll"><table><thead><tr><th>FII</th><th>Cotas</th><th>Preço médio</th><th>Cotação</th><th>Dia</th><th>Valor</th><th>Resultado</th><th>Provento/cota</th><th>Renda/mês</th><th>Yield a.a.</th><th></th></tr></thead><tbody>
      ${pos.map(p => `<tr><td><b>${p.ticker}</b></td><td class="num">${p.qty}</td><td class="num">${brl(p.avg)}</td><td class="num">${brl(p.price)}${p.hasQuote ? '' : '<span class="tag">s/ cotação</span>'}</td>
        <td class="num ${p.change > 0 ? 'green' : p.change < 0 ? 'rose' : 'mut'}">${p.change == null ? '—' : (p.change > 0 ? '+' : '') + pct(p.change, 2)}</td>
        <td class="num">${brl(p.value)}</td><td class="num ${p.pl >= 0 ? 'green' : 'rose'}">${p.pl >= 0 ? '+' : ''}${brl(p.pl)}<br><small>${pct(p.plPct)}</small></td>
        <td class="num">${p.dps ? brl4(p.dps) : '—'}</td><td class="num amber">${p.dps ? brl(p.income) : '—'}</td><td class="num">${p.dps ? pct(p.dyAnual) : '—'}</td>
        <td><button class="btn sm" data-act="editFii" data-id="${p.ticker}">Editar</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">Nenhum FII ainda.<br><br><button class="btn primary" data-act="addTrade" data-v="C">+ Registrar sua primeira compra</button></div>`}
  </div>

  ${trades.length ? `<div class="card" style="margin-top:12px"><h2>Histórico de operações</h2><div class="scroll"><table><thead><tr><th>Data</th><th class="l">FII</th><th class="l">Tipo</th><th>Cotas</th><th>Preço</th><th>Total</th><th></th></tr></thead><tbody>
    ${trades.map(t => `<tr><td>${(t.date || '').split('-').reverse().join('/')}</td><td class="l"><b>${t.ticker}</b></td><td class="l ${t.side === 'V' ? 'rose' : 'green'}">${t.side === 'V' ? 'Venda' : 'Compra'}</td><td class="num">${t.qty}</td><td class="num">${brl(t.price)}</td><td class="num">${brl(t.qty * t.price + (t.side === 'V' ? -(t.fees || 0) : (t.fees || 0)))}</td><td><button class="btn sm ghost danger" data-act="delTrade" data-id="${t.id}">✕</button></td></tr>`).join('')}
    </tbody></table></div></div>` : ''}`;
}

function viewProj() {
  const N = 20, start = state.selectedMonth, T = totals(), P = passiveMonthly();
  let patr = T.patrimonio; const rows = [];
  for (let i = 0; i < N; i++) {
    const m = addMonths(start, i), inc = incomeFor(m).value, exp = totalExpenses(), sobra = inc - exp;
    const cup = couponsInMonth(m), passivo = P.caixa + P.fii + cup;
    const invest = (sobra > 0 ? sobra * state.projSavePct / 100 : sobra);
    patr += invest + passivo;
    rows.push({ m, inc, exp, sobra, cup, passivo, patr });
  }
  const maxV = Math.max(...rows.map(r => Math.max(r.inc, r.exp)), 1);
  return `
  <div class="card">
    <h2>Renda × despesas, mês a mês <span class="sub">${mlabel(rows[0].m)} → ${mlabel(rows[N - 1].m)}</span></h2>
    <div class="chart">${rows.map(r => `<div class="col" title="${mlabel(r.m)} — renda ${brl(r.inc)} · despesas ${brl(r.exp)}"><div class="bars"><i style="height:${r.inc / maxV * 100}%;background:var(--brand)"></i><i style="height:${r.exp / maxV * 100}%;background:var(--rose)"></i></div><small>${mlabel(r.m)}</small></div>`).join('')}</div>
    <div class="legend"><span style="--c:var(--brand)">Renda prevista</span><span style="--c:var(--rose)">Despesas fixas</span></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h2>Projeção de patrimônio e proventos
      <span class="row"><label class="hint" for="sp" style="margin:0">Quanto da sobra vira investimento</label><input id="sp" class="inl num" style="width:62px" type="number" min="0" max="100" value="${state.projSavePct}" data-chg="setSavePct" /><span class="hint" style="margin:0">%</span></span></h2>
    <div class="scroll"><table><thead><tr><th>Mês</th><th>Renda</th><th>Despesas</th><th>Sobra</th><th>Cupom Tesouro</th><th>Renda passiva</th><th>Patrimônio projetado</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${mlabel(r.m)}</td><td class="num green">${brl(r.inc)}</td><td class="num rose">${brl(r.exp)}</td><td class="num ${r.sobra >= 0 ? '' : 'rose'}">${brl(r.sobra)}</td><td class="num">${r.cup ? brl(r.cup) : '—'}</td><td class="num amber">${brl(r.passivo)}</td><td class="num" style="font-weight:700">${brl(r.patr)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="hint" style="margin-top:10px">Como é calculado: a renda de cada mês é a soma dos projetos ativos (aba Renda). A renda passiva usa os saldos e proventos <b>de hoje</b> (juros do caixa líquidos de IR + proventos dos FIIs + cupons do Tesouro), reinvestida no patrimônio. Meses com despesa maior que a renda saem do patrimônio. É uma estimativa, não uma garantia: o CDI, os proventos e as cotações mudam.</div>
  </div>`;
}

/* =========================================================
   Render
   ========================================================= */
const TABS = [['resumo', 'Resumo'], ['renda', 'Renda & Despesas'], ['caixa', 'Caixa & Renda Fixa'], ['fiis', 'FIIs'], ['proj', 'Projeção']];
function render() {
  try {
    $('month').value = state.selectedMonth;
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${tab === k ? 'active' : ''}" data-act="tab" data-tab="${k}">${l}</button>`).join('');
    const v = { resumo: viewResumo, renda: viewRenda, caixa: viewCaixa, fiis: viewFiis, proj: viewProj }[tab] || viewResumo;
    const y = window.scrollY; $('view').innerHTML = v(); window.scrollTo(0, y);
    setSyncPill();
  } catch (e) { console.error('Erro ao renderizar:', e); $('view').innerHTML = `<div class="empty">Erro ao desenhar a tela: ${esc(e.message)}<br>Seus dados estão salvos. Use ⚙ → Exportar backup.</div>`; }
}

/* importar backup */
const imp = document.createElement('input'); imp.type = 'file'; imp.accept = 'application/json'; imp.id = 'importFile'; imp.style.display = 'none'; document.body.appendChild(imp);
imp.addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); state = normalize(o); state.updatedAt = Date.now(); save(); closeSheet(); toast('Backup importado'); } catch (er) { alert('Arquivo de backup inválido.'); } };
  r.readAsText(f); imp.value = '';
});

(function boot() {
  try { persistLocal(); } catch (e) {}       // grava a versão migrada (e o backup da antiga já foi guardado)
  initFirebase();
  if (!fb) { synced = true; applyDailyCompound(true); if (localStorage.getItem(TK) && fiiPositions().length) refreshQuotes(true); }
  else setTimeout(() => { if (!synced) { synced = true; applyDailyCompound(false); render(); } }, 4000); // sem conexão: segue local
  render();
})();
</script>
</body>
</html>
